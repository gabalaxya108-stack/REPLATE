server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: replate-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/replate_db
    username: ${DB_USERNAME:laxyagaba}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

